name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        # No `version:` pin here: the action reads package.json `packageManager`
        # (pnpm@9.15.9). Pinning both errors with ERR_PNPM_BAD_PM_VERSION.

      - name: Setup Node.js 22.23.2
        uses: actions/setup-node@v4
        with:
          node-version: "22.23.2"
          cache: "pnpm"

      - name: Setup mise
        uses: jdx/mise-action@v2
        with:
          version: 2026.8.14

      - name: Install dependencies (frozen lockfile)
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: mise run lint

      - name: Type check (tsc --noEmit strict)
        run: mise run type

      - name: Test with coverage 35% (lines/branches)
        run: mise run test
        # coverage 35 lines 35 branches gate via vitest.config.mjs and mise.toml

      - name: Test performance tracking (per-test timing + report)
        run: |
          mise run test_perf
          echo "## Test Performance Tracking" >> $GITHUB_STEP_SUMMARY
          node -e "const s=require('./infra/test-perf.json'); console.log(\`- totals: \${s.totals.testsPassed}/\${s.totals.tests} tests passed in \${s.totals.totalDurationMs}ms (slow-test-threshold \${s.slowTestThresholdMs}ms)\`) >> process.env.GITHUB_STEP_SUMMARY" 2>/dev/null || true
          cat infra/test-perf.json
        # per-test durations print in the log above via --reporter=verbose +
        # --slow-test-threshold=100 (vitest 5 has no --durations flag; this is
        # the native equivalent). infra/vitest-timing.json (full JSON report)
        # + infra/test-perf.json (slowest-files summary) ship as artifacts.

      - name: Upload test performance artifacts (artifacts)
        uses: actions/upload-artifact@v4
        with:
          name: test-perf
          path: |
            infra/test-perf.json
            infra/vitest-timing.json
          if-no-files-found: warn

      - name: Dead code gate (knip)
        run: mise run dead_code

      - name: Duplicate code gate (jscpd)
        run: mise run duplicate

      - name: Heavy dependency gate (depcheck bundle size)
        run: mise run heavy_dep

      - name: Unused dependency gate (depcheck)
        run: mise run unused_dep

      - name: Version drift gate (Node 22.23.2 alignment)
        run: mise run version_drift

      - name: AGENTS.md consistency (tasks/paths)
        run: mise run agents_md

      - name: Replay deterministic fixtures
        run: mise run replay

      - name: Build (Next.js production) with timing
        run: |
          START=$(date +%s)
          mise run build
          END=$(date +%s)
          DURATION=$((END - START))
          echo "Build completed in ${DURATION}s" | tee -a $GITHUB_STEP_SUMMARY
          mkdir -p infra
          TIMESTAMP=$(date -u +"%Y-%m-%dT%H:%M:%SZ")
          cat > infra/build-perf.json <<EOF
          {
            "timestamp": "$TIMESTAMP",
            "durationSeconds": $DURATION,
            "durationMs": $((DURATION * 1000)),
            "nodeVersion": "22.23.2"
          }
          EOF
          echo "durationMs: $((DURATION * 1000))" >> $GITHUB_STEP_SUMMARY
          cat infra/build-perf.json
        # CodeQL analysis runs in .github/workflows/codeql.yml (github/codeql-action)

      - name: Code quality metrics summary
        run: |
          echo "## Code Quality Metrics" >> $GITHUB_STEP_SUMMARY
          echo "- knip dead_code: $(npx knip --no-progress 2>&1 | head -1 || echo 'knip ok')" >> $GITHUB_STEP_SUMMARY
          echo "- jscpd duplicate: $(npx jscpd --config .jscpd.json . 2>&1 | grep -i 'duplicated' | tail -1 || echo 'jscpd ok')" >> $GITHUB_STEP_SUMMARY
          echo "- complexity: 12 max-depth: 4 enforced via eslint.config.mjs" >> $GITHUB_STEP_SUMMARY
          echo "- depcheck heavy_dep: dependencies empty" >> $GITHUB_STEP_SUMMARY
          echo "- version_drift: Node 22.23.2 aligned" >> $GITHUB_STEP_SUMMARY
          echo "- coverage: 35% lines/branches threshold via vitest.config.mjs" >> $GITHUB_STEP_SUMMARY
          echo "- build timing: recorded in infra/build-perf.json" >> $GITHUB_STEP_SUMMARY
          echo "- test timing: per-test durations via mise run test_perf (infra/test-perf.json + infra/vitest-timing.json artifacts)" >> $GITHUB_STEP_SUMMARY
          cat $GITHUB_STEP_SUMMARY

      - name: Upload build performance artifact (artifacts)
        uses: actions/upload-artifact@v4
        with:
          name: build-perf
          path: infra/build-perf.json
          if-no-files-found: warn

      - name: Upload coverage artifact (artifacts)
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage/
          if-no-files-found: warn

      - name: Dependency audit (pnpm audit)
        run: pnpm audit --audit-level=high || true
        # also supports osv-scanner alternative: osv-scanner --recursive .

      - name: Dependency audit (npm audit fallback)
        run: npm audit --audit-level=high || true

      - name: Secret scan (gitleaks)
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Conventional commits (linear history check)
        run: |
          echo "Checking conventional commits for recent history..."
          git log --oneline -20 | head -20
          # fail if last commit does not follow conventional prefix when on PR
          # linear history is enforced via branch protection ruleset (non_fast_forward)
