# Mirror of the repo-root `netlify.toml` (Netlify only reads the root file).
# The root file additionally declares `[[plugins]] @netlify/plugin-nextjs`
# (Next.js runtime for SSR/API routes). Keep the [build], [context.*], and
# [[headers]] blocks below in sync with the root file — enforced by
# `scripts/check_version_drift.sh`. Do not edit one without the other.
[build]
  command = "pnpm build"
  publish = ".next"

[build.environment]
  NODE_VERSION = "22.23.2"

[context.production]
  command = "pnpm build"

[context.deploy-preview]
  command = "pnpm build"

[context.branch-deploy]
  command = "pnpm build"

[[headers]]
  for = "/api/*"
  [headers.values]
    cache-control = "no-store"
