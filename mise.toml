[tools]
node = "22.23.2"
pnpm = "9.15.9"
pitchfork = "2.23.0"

[env]
# NODE_ENV left to Next.js defaults (development for dev, production for build)
# explicitly set only where needed via task env

[tasks.setup]
description = "One-command fresh-clone setup: seed .env (never overwrite), enable corepack, install pnpm deps (idempotent)"
run = "bash -c '\nset -euo pipefail\nif [ ! -f .env ]; then\n  cp .env.example .env\n  echo \"setup: created .env from .env.example (leave OPENAI_API_KEY empty for mock mode)\"\nelse\n  echo \"setup: .env exists, leaving untouched\"\nfi\ncorepack enable\npnpm install --frozen-lockfile\nnode --version && pnpm --version\n'"

[tasks.dev]
description = "Next.js dev server (auto-reload) for interactive QA"
run = "npx next dev --port 3000"

[tasks.build]
description = "Production build"
run = "npx next build"
env = { NODE_ENV = "production" }

[tasks.lint]
description = "ESLint + Prettier check (complexity via eslint if needed)"
run = "npx eslint . && npx prettier --check ."

[tasks.lint-fix]
description = "Auto-fix lint and format"
run = "npx eslint . --fix && npx prettier --write ."

[tasks.type]
description = "TypeScript strict type check"
run = "npx tsc --noEmit"

[tasks.test]
description = "Vitest with coverage gate 35%"
run = "npx vitest run --coverage --coverage.thresholds.lines=35 --coverage.thresholds.branches=35"

[tasks.test-quick]
description = "Fast Vitest without coverage"
run = "npx vitest run"

[tasks.check]
description = "Run lint, type, and test"
depends = ["lint", "type", "test"]

[tasks.coverage]
description = "Coverage report"
run = "npx vitest run --coverage"

[tasks.replay]
description = "Deterministic fixture replay (score + claim golden files)"
run = "npx vitest run tests/replay -v"

[tasks.qa]
description = "Interactive QA: starts ephemeral server and curls every endpoint"
run = "./scripts/qa_smoke.sh --ephemeral"

[tasks.smoke]
description = "Alias for qa (ephemeral smoke)"
run = "./scripts/qa_smoke.sh --ephemeral"

[tasks.dead_code]
description = "Dead code detection via knip (0 unused)"
run = "npx knip --no-progress"

[tasks.duplicate]
description = "Duplicate code via jscpd under threshold"
run = "npx jscpd --config .jscpd.json ."

[tasks.heavy_dep]
description = "Heavy dependency / bundle size check via depcheck"
run = "npx depcheck --json | tee /tmp/depcheck.json && node -e \"const j=require('/tmp/depcheck.json'); const deps=j.dependencies||[]; if(deps.length>0){console.error('heavy_dep: unused dependencies',deps);process.exit(1);} console.log('heavy_dep: no bloated deps, dependencies empty');\""

[tasks.unused_dep]
description = "Unused dependency check (depcheck) — dependencies empty"
run = "npx depcheck --json | tee /tmp/depcheck.json && node -e \"const j=require('/tmp/depcheck.json'); const deps=j.dependencies||[]; if(deps.length>0){console.error('unused_dep: dependencies not empty',deps);process.exit(1);} console.log('unused_dep: dependencies empty');\""

[tasks.version_drift]
description = "Version drift check Node 22.23.2 alignment"
run = "bash scripts/check_version_drift.sh"

[tasks.agents_md]
description = "Validate AGENTS.md tasks/paths still match code (readiness agents_md_validation)"
run = "bash scripts/check_agents_md.sh"

[tasks.build-perf]
description = "Build with timing artifact infra/build-perf.json"
run = "bash scripts/build_perf.sh"

[tasks.quality]
description = "All quality gates: lint + type + dead_code + duplicate + heavy_dep + unused_dep + version_drift + test coverage 35"
depends = ["lint", "type", "dead_code", "duplicate", "heavy_dep", "unused_dep", "version_drift", "test"]

[tasks.docs]
description = "Generate docs/api.md from lib/ via typedoc (docs:generate fallback)"
run = "node scripts/gen_docs.mjs"

[tasks."docs:generate"]
description = "Alias for docs generation (typedoc)"
run = "node scripts/gen_docs.mjs"

[tasks."docs:typedoc"]
description = "Run typedoc directly (requires typedoc + plugin)"
run = "npx typedoc"

[tasks.devcontainer-verify]
description = "Verify devcontainer contract without running docker"
run = "bash scripts/check_large_files.sh && bash scripts/check_tech_debt.sh"
